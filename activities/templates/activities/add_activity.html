{% extends "layouts/member_base.html" %}
{% block dashboard_content %}
<div class="container mt-4">
    <h2>Add Activity</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Activity Type</label>
            <select class="form-select" name="activity_type">
                {% for value, label in activity_choices %}
                <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" name="date">
        </div>
        <div class="mb-3">
            <label class="form-label">Distance (km)</label>
            <input type="number" step="0.01" min="0.01" class="form-control" name="distance_km">
        </div>
        <div class="mb-3">
            <label class="form-label">Duration (minutes)</label>
            <input type="number" min="1" class="form-control" name="duration_minutes">
        </div>
        <button type="submit" class="btn btn-success">Save Activity</button>
    </form>
</div>
{% endblock %}
