{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Correct Attendance Record</h2>
    <p>Member: <strong>{{ record.member }}</strong></p>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Check-in Time</label>
            <input type="datetime-local" class="form-control" name="check_in_time"
                   value="{{ record.check_in_time|date:'Y-m-d\TH:i' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Check-out Time</label>
            <input type="datetime-local" class="form-control" name="check_out_time"
                   value="{{ record.check_out_time|date:'Y-m-d\TH:i' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Correction Note (required)</label>
            <textarea class="form-control" name="correction_note" required></textarea>
        </div>
        <button type="submit" class="btn btn-warning">Save Correction</button>
        <a href="{% url 'attendance:attendance_history' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
