{% extends "layouts/member_base.html" %}
{% block dashboard_content %}
<div class="container mt-4">
    <h2>My QR Code</h2>

    {% if qr_code.is_active %}
        <div class="card p-4 text-center" style="max-width: 300px;">
            <img src="data:image/png;base64,{{ qr_image }}" alt="QR Code" class="img-fluid mb-3">
            <p class="text-success">Active — show this at check-in</p>
        </div>
    {% else %}
        <div class="alert alert-warning">
            Your QR code is currently inactive. This may be due to an
            expired or unavailable membership. Please contact staff.
        </div>
    {% endif %}
</div>
{% endblock %}
