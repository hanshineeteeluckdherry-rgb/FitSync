{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Attendance Report</h2>
    <p class="text-muted">Total check-ins per day</p>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Date</th>
                <th>Total Check-ins</th>
            </tr>
        </thead>
        <tbody>
            {% for entry in daily_counts %}
            <tr>
                <td>{{ entry.day|date:"d M Y" }}</td>
                <td>{{ entry.total_check_ins }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="2" class="text-muted">No attendance data yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
