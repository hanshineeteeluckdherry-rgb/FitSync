{% load static %}

<div class="sidebar-brand">
    <a class="fitsync-brand" href="{% url 'core:home' %}">
        <img
            src="{% static 'img/fitsync-logo.png' %}"
            class="fitsync-logo"
            alt="FitSync Logo"
        >

        <span class="fitsync-brand-name">
            Fit<span class="brand-accent">Sync</span>
        </span>
    </a>
</div>

<nav
    class="nav flex-column sidebar-nav"
    aria-label="Member menu"
>
    <p class="sidebar-label">
        Member Menu
    </p>

    <!-- Dashboard -->
    <a
        class="nav-link {% if active_sidebar == 'dashboard' %}active{% endif %}"
        href="{% url 'accounts:member_dashboard' %}"
    >
        <i class="bi bi-grid"></i>
        <span>Dashboard</span>
    </a>

    <!-- Membership -->
    <a
        class="nav-link {% if active_sidebar == 'membership' %}active{% endif %}"
        href="{% url 'memberships:member_packages' %}"
    >
        <i class="bi bi-credit-card"></i>
        <span>Membership</span>
    </a>

    <!-- Payments -->
    <a
        class="nav-link {% if active_sidebar == 'payments' %}active{% endif %}"
        href="{% url 'memberships:payment_history' %}"
    >
        <i class="bi bi-wallet2"></i>
        <span>Payments</span>
    </a>

    <!-- QR Code -->
    <a
        class="nav-link {% if active_sidebar == 'qr' %}active{% endif %}"
        href="{% url 'attendance:my_qr_code' %}"
    >
        <i class="bi bi-qr-code"></i>
        <span>My QR Code</span>
    </a>

    <!-- Bookings -->
    <a
        class="nav-link {% if active_sidebar == 'bookings' %}active{% endif %}"
        href="#"
    >
        <i class="bi bi-calendar-check"></i>
        <span>Bookings</span>
    </a>

    <!-- Workout Plans -->
    <a
        class="nav-link {% if active_sidebar == 'plans' or active_sidebar == 'history' %}active{% endif %}"
        href="{% url 'workouts:plans' %}"
    >
        <i class="bi bi-clipboard2-pulse"></i>
        <span>Workout Plans</span>
    </a>

    <!-- Progress -->
    <a
        class="nav-link {% if active_sidebar == 'progress' %}active{% endif %}"
        href="{% url 'workouts:progress' %}"
    >
        <i class="bi bi-graph-up-arrow"></i>
        <span>Progress</span>
    </a>

    <!-- Outdoor Activities -->
    <a
        class="nav-link {% if active_sidebar == 'activities' %}active{% endif %}"
        href="{% url 'activities:activity_list' %}"
    >
        <i class="bi bi-geo-alt"></i>
        <span>Outdoor Activities</span>
    </a>

    <!-- Profile -->
    <a
        class="nav-link {% if active_sidebar == 'profile' %}active{% endif %}"
        href="{% url 'accounts:profile' %}"
    >
        <i class="bi bi-person"></i>
        <span>Profile</span>
    </a>

</nav>
