{% extends "base.html" %}
{% block title %}Change Password | FitSync{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-6">
<div class="card p-4 p-md-5">
    <h1 class="h3 fw-bold">Change password</h1>
    <p class="text-body-secondary">Enter your current password, then choose a new secure password.</p>
    <form method="post" novalidate>{% csrf_token %}{% include "accounts/_form_fields.html" with form=form %}<button class="btn btn-primary-fitsync" type="submit">Update password</button></form>
</div></div></div></div>
{% endblock %}
