{% extends base_template %}
{% block page_title %}{{ title }}{% endblock %}
{% block dashboard_heading %}{{ title }}{% endblock %}
{% block dashboard_content %}
<div class="page-heading"><h1>{{ title }}</h1><p>{{ subtitle }}</p></div>
<div class="card p-4" style="max-width: 760px;">
    <form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}
        {% include "includes/form_fields.html" %}
        <div class="d-flex gap-2"><button class="btn btn-primary-fitsync" type="submit">Save</button><a class="btn btn-secondary-fitsync" href="{{ cancel_url }}">Cancel</a></div>
    </form>
</div>
{% endblock %}
